<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Muse Cosmetics</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="animations.css">
    <style>
        .product-details-section {
            padding: 120px 0 80px;
        }
        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            margin-bottom: 60px;
        }
        .product-images {
            position: relative;
        }
        .product-image-shell {
            position: relative;
            padding: 18px;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .product-image-shell.theme-carrot {
            background: linear-gradient(135deg, rgba(255, 196, 210, 0.92), rgba(255, 241, 245, 0.94));
        }
        .product-image-shell.theme-aloe {
            background: linear-gradient(135deg, rgba(190, 228, 255, 0.92), rgba(237, 246, 255, 0.94));
        }
        .product-image-shell.theme-ocean {
            background: linear-gradient(135deg, rgba(205, 244, 243, 0.92), rgba(239, 252, 251, 0.94));
        }
        .product-image-shell.theme-glycerin {
            background: linear-gradient(135deg, rgba(252, 240, 212, 0.94), rgba(255, 251, 241, 0.96));
        }
        .product-image-shell.theme-milking {
            background: linear-gradient(135deg, rgba(244, 238, 231, 0.94), rgba(255, 252, 248, 0.96));
        }
        .main-image {
            width: 100%;
            height: 500px;
            object-fit: contain;
            object-position: center;
            background: rgba(255, 255, 255, 0.35);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: transform 0.5s ease;
            box-shadow: var(--shadow);
        }
        .main-image:hover {
            transform: rotateY(180deg);
        }
        .detail-note {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            color: var(--text-light);
            font-size: 0.92rem;
        }
        .detail-note span {
            background: rgba(255,255,255,0.75);
            padding: 8px 12px;
            border-radius: 999px;
        }
        .image-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .product-info-detail h1 {
            font-family: var(--font-secondary);
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        .product-rating-detail {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .stars {
            color: #ffc107;
        }
        .price-display {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 20px 0;
        }
        .size-note {
            color: var(--text-light);
            margin-top: -12px;
        }
        .size-selector {
            margin: 30px 0;
        }
        .size-selector label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .size-options-detail {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .size-btn {
            padding: 10px 25px;
            border: 2px solid var(--primary-color);
            background: transparent;
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
        }
        .size-btn:hover, .size-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .product-description, .product-ingredients, .product-benefits {
            margin: 30px 0;
        }
        .product-description h3, .product-ingredients h3, .product-benefits h3 {
            font-family: var(--font-secondary);
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--dark-color);
        }
        .benefits-list {
            list-style: none;
        }
        .benefits-list li {
            padding: 8px 0;
            padding-left: 30px;
            position: relative;
        }
        .benefits-list li:before {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: 0;
            color: var(--primary-color);
        }
        .add-to-cart-section {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }
        .quantity-selector {
            display: flex;
            align-items: center;
            border: 2px solid var(--primary-color);
            border-radius: 5px;
            overflow: hidden;
        }
        .qty-btn {
            width: 40px;
            height: 50px;
            border: none;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .qty-input {
            width: 60px;
            text-align: center;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .btn-add-cart-large {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1rem;
        }
        .reviews-section {
            margin-top: 80px;
        }
        .review-card {
            background: var(--light-color);
            padding: 30px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .reviewer-name {
            font-weight: 600;
        }
        .review-date {
            color: var(--text-light);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <span class="logo-icon"><i class="fas fa-spa"></i></span>
                    <span class="logo-text">Muse Cosmetics</span>
                </a>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="products.html" class="nav-link active">Our Products</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="faq.html" class="nav-link">FAQ</a></li>
                <li><a href="feedback.html" class="nav-link">Reviews</a></li>
                <li><a href="cart.html" class="nav-link cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a></li>
                <li><a href="login.html" class="nav-link" id="authLink">Login</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- Product Details Section -->
    <section class="product-details-section">
        <div class="container">
            <div id="productDetails">
                <!-- Product details will be loaded dynamically -->
            </div>
            
            <!-- Reviews Section -->
            <div class="reviews-section">
                <h2 class="section-title">Customer Reviews</h2>
                <div id="reviewsContainer">
                    <!-- Reviews will be loaded here -->
                </div>
            </div>
            
            <!-- Related Products -->
            <div class="related-products" style="margin-top: 80px;">
                <h2 class="section-title text-center">Related Products</h2>
                <div class="products-grid" id="relatedProducts"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col">
                    <h3>Muse Cosmetics</h3>
                    <p>Premium beauty products crafted with love in Nakuru, Kenya.</p>
                </div>
                <div class="footer-col">
                    <h3>Quick Links</h3>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="products.html">Our Products</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Muse Cosmetics. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
    <script src="cart.js"></script>
    <script src="products.js?v=2"></script>
    <script>
        const DETAILS_API_BASE_URL = window.API_BASE_URL || ((window.location.protocol === 'file:' || (window.location.hostname === 'localhost' && window.location.port !== '5000')) ? 'http://localhost:5000/api/v1' : '/api/v1');

        function normalizeProduct(product) {
            const sizes = Array.isArray(product.sizes) && product.sizes.length > 0
                ? product.sizes
                : [{ size: 'Standard', price: product.price || 0 }];

            return {
                id: product.id ?? product._id,
                apiId: product._id || product.apiId || product.id || null,
                name: product.name,
                category: product.category,
                description: product.description || '',
                ingredients: product.ingredients || '',
                benefits: Array.isArray(product.benefits) ? product.benefits : [],
                image: product.image,
                imageBack: product.imageBack || product.image,
                sizes,
                rating: product.averageRating ?? product.rating ?? 0,
                reviews: Array.isArray(product.reviews) ? product.reviews : (product.reviewCount ?? 0)
            };
        }

        // Render product details
        function renderProductDetails(product) {
            const container = document.getElementById('productDetails');
            if (!container) return;

            const reviewCount = Array.isArray(product.reviews) ? product.reviews.length : (product.reviews || product.reviewCount || 0);
            const rating = product.rating ?? product.averageRating ?? 0;
            const themeClass = typeof getProductThemeClass === 'function' ? getProductThemeClass(product) : '';
            
            container.innerHTML = `
                <div class="product-detail-grid">
                    <div class="product-images">
                        <div class="product-image-shell ${themeClass}">
                            <img src="${product.image}" alt="${product.name}" class="main-image" id="mainImage" loading="lazy" decoding="async">
                            <div class="image-hint">
                                <i class="fas fa-sync-alt"></i> Click to rotate
                            </div>
                        </div>
                        <div class="detail-note">
                            <span>Tap the image to switch views</span>
                            <span>Add to cart after choosing a size</span>
                        </div>
                    </div>
                    <div class="product-info-detail">
                        <div class="product-category">${product.category}</div>
                        <h1>${product.name}</h1>
                        <div class="product-rating-detail">
                            <div class="stars">${renderStars(rating)}</div>
                            <span>${rating} (${reviewCount} reviews)</span>
                        </div>
                        <div class="price-display" id="priceDisplay">${typeof getProductPriceSummary === 'function' ? getProductPriceSummary(product) : `From Ksh ${Math.min(...product.sizes.map(s => s.price))}/=`}</div>
                        <p class="size-note">Choose a size below to see the exact price before adding to cart.</p>
                        
                        <div class="size-selector">
                            <label>Select Size:</label>
                            <div class="size-options-detail" id="sizeOptions">
                                ${product.sizes.map((s, index) => `
                                    <button class="size-btn ${index === 0 ? 'active' : ''}" 
                                            onclick="selectSizeDetail(${s.price}, '${s.size}', this)">
                                        ${s.size} - Ksh ${s.price}/=
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                        
                        <div class="product-description">
                            <h3>Description</h3>
                            <p>${product.description}</p>
                        </div>
                        
                        <div class="product-ingredients">
                            <h3>Ingredients</h3>
                            <p>${product.ingredients}</p>
                        </div>
                        
                        <div class="product-benefits">
                            <h3>Benefits</h3>
                            <ul class="benefits-list">
                                ${product.benefits.map(b => `<li>${b}</li>`).join('')}
                            </ul>
                        </div>
                        
                        <div class="add-to-cart-section">
                            <div class="quantity-selector">
                                <button class="qty-btn" onclick="changeQuantity(-1)">-</button>
                                <input type="number" class="qty-input" value="1" min="1" id="quantity" readonly>
                                <button class="qty-btn" onclick="changeQuantity(1)">+</button>
                            </div>
                            <button class="btn btn-primary btn-add-cart-large" onclick='addToCartFromDetail(${JSON.stringify(product.apiId || product.id)})'>
                                <i class="fas fa-cart-plus"></i> Add to Cart
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            // Image rotation functionality
            const mainImage = document.getElementById('mainImage');
            let showingFront = true;
            
            mainImage.addEventListener('click', () => {
                if (showingFront) {
                    mainImage.src = product.imageBack;
                    mainImage.style.transform = 'rotateY(180deg)';
                } else {
                    mainImage.src = product.image;
                    mainImage.style.transform = 'rotateY(0deg)';
                }
                showingFront = !showingFront;
            });
            
            // Load related products
            loadRelatedProducts(product.category, product.id);
            
            // Load reviews (mock)
            loadReviews(product);
        }
        
        let selectedPrice = 0;
        let currentSize = '';
        
        function selectSizeDetail(price, size, btn) {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedPrice = price;
            currentSize = size;
            document.getElementById('priceDisplay').textContent = `Ksh ${price}/=`;
        }
        
        function changeQuantity(change) {
            const input = document.getElementById('quantity');
            let value = parseInt(input.value) + change;
            if (value < 1) value = 1;
            input.value = value;
        }
        
        function addToCartFromDetail(productId) {
            const quantity = parseInt(document.getElementById('quantity').value);
            const size = currentSize || '200ml';
            addToCart(productId, quantity, size, selectedPrice || null);
        }
        
        function loadRelatedProducts(category, currentId) {
            const catalog = typeof getCatalogProducts === 'function' ? getCatalogProducts() : productsData;
            const related = catalog.filter(p => 
                p.category === category &&
                String(p.id) !== String(currentId) &&
                String(p.apiId || '') !== String(currentId)
            ).slice(0, 4);
            renderProducts(related, 'relatedProducts');
        }
        
        function loadReviews(product) {
            const reviews = Array.isArray(product.reviews) && product.reviews.length > 0
                ? product.reviews.map(review => ({
                    name: review.user?.name || review.userDetails?.name || 'Verified customer',
                    rating: review.rating,
                    date: new Date(review.createdAt || Date.now()).toLocaleDateString('en-US', {
                        month: 'long',
                        day: 'numeric',
                        year: 'numeric'
                    }),
                    comment: review.comment || review.title || 'Great product.'
                }))
                : [
                    {
                        name: 'Sarah Mwangi',
                        rating: 5,
                        date: 'March 1, 2026',
                        comment: 'Excellent product! My skin feels so soft and moisturized. Highly recommend!'
                    },
                    {
                        name: 'John Kamau',
                        rating: 4,
                        date: 'February 28, 2026',
                        comment: 'Good quality for the price. Will definitely buy again.'
                    },
                    {
                        name: 'Jane Ochieng',
                        rating: 5,
                        date: 'February 25, 2026',
                        comment: 'Best lotion I have ever used. The scent is amazing!'
                    }
                ];
            
            const container = document.getElementById('reviewsContainer');
            if (container) {
                container.innerHTML = reviews.map(review => `
                    <div class="review-card">
                        <div class="review-header">
                            <div>
                                <div class="reviewer-name">${review.name}</div>
                                <div class="stars">${renderStars(review.rating)}</div>
                            </div>
                            <div class="review-date">${review.date}</div>
                        </div>
                        <p>${review.comment}</p>
                    </div>
                `).join('');
            }
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                document.getElementById('productDetails').innerHTML = '<h2>Product not found</h2>';
                return;
            }

            const localProduct = typeof getCatalogProductById === 'function'
                ? getCatalogProductById(productId)
                : productsData.find(p => String(p.id) === String(productId));

            if (localProduct) {
                renderProductDetails(localProduct);
                selectedPrice = localProduct.sizes[0]?.price || localProduct.price || 0;
                currentSize = localProduct.sizes[0]?.size || 'Standard';
            } else {
                document.getElementById('productDetails').innerHTML = '<h2>Product not found</h2>';
            }

            fetch(`${DETAILS_API_BASE_URL}/products/${encodeURIComponent(productId)}`)
                .then(response => response.json().then(result => ({ response, result })))
                .then(({ response, result }) => {
                    if (response.ok && result.success && result.data) {
                        const product = normalizeProduct(result.data);
                        renderProductDetails(product);
                        selectedPrice = product.sizes[0]?.price || product.price || 0;
                        currentSize = product.sizes[0]?.size || 'Standard';
                    }
                })
                .catch(error => {
                    console.warn('Falling back to local product data:', error);
                });
        });
    </script>
</body>
</html>
