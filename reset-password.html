<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Muse Cosmetics</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="animations.css">
    <style>
        .auth-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px;
            background: linear-gradient(135deg, var(--accent-color) 0%, var(--light-color) 100%);
        }
        .auth-container {
            background: var(--white);
            padding: 50px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-hover);
            max-width: 520px;
            width: 100%;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header h1 {
            font-family: var(--font-secondary);
            font-size: 2.4rem;
            margin-bottom: 10px;
            color: var(--dark-color);
        }
        .auth-copy {
            color: var(--text-light);
            line-height: 1.7;
            margin-bottom: 28px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
        }
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            font-size: 1.05rem;
            margin-bottom: 16px;
        }
        .auth-footer {
            text-align: center;
            color: var(--text-light);
        }
        .auth-footer a {
            color: var(--primary-color);
            font-weight: 600;
        }
        .recovery-switch {
            display: inline-flex;
            gap: 10px;
            margin: 0 0 24px;
            padding: 6px;
            border-radius: 999px;
            background: rgba(0,0,0,0.04);
        }
        .recovery-switch button {
            border: 0;
            background: transparent;
            border-radius: 999px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-light);
        }
        .recovery-switch button.active {
            background: var(--primary-color);
            color: white;
        }
        .hidden {
            display: none !important;
        }
        .helper-box {
            background: rgba(243, 208, 219, 0.22);
            border: 1px solid rgba(198, 126, 149, 0.18);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-header">
                <h1>Password Recovery</h1>
                <p>Reset your Muse Cosmetics account password</p>
            </div>

            <div class="recovery-switch" role="tablist" aria-label="Password recovery mode">
                <button type="button" id="requestModeBtn" class="active">Send Reset Link</button>
                <button type="button" id="resetModeBtn">Set New Password</button>
            </div>

            <div class="helper-box" id="requestHelp">
                Enter your email address and we’ll send a password reset link.
            </div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="resetEmail">Email Address</label>
                    <input type="email" id="resetEmail" required placeholder="Enter your email address">
                </div>
                <button type="submit" class="btn btn-primary btn-submit">
                    <i class="fas fa-paper-plane"></i> Send Reset Link
                </button>
            </form>

            <form id="resetPasswordForm" class="hidden">
                <div class="helper-box">
                    Use the token from your reset email, or open the link directly from the email.
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required placeholder="Enter new password">
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" required placeholder="Confirm new password">
                </div>
                <button type="submit" class="btn btn-primary btn-submit">
                    <i class="fas fa-lock"></i> Reset Password
                </button>
            </form>

            <div class="auth-footer">
                <p><a href="login.html">← Back to Login</a></p>
                <p><a href="index.html">← Back to Home</a></p>
            </div>
        </div>
    </section>

    <script src="auth.js"></script>
    <script>
        const requestModeBtn = document.getElementById('requestModeBtn');
        const resetModeBtn = document.getElementById('resetModeBtn');
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const resetPasswordForm = document.getElementById('resetPasswordForm');
        const requestHelp = document.getElementById('requestHelp');

        function setMode(mode) {
            const isResetMode = mode === 'reset';
            requestModeBtn.classList.toggle('active', !isResetMode);
            resetModeBtn.classList.toggle('active', isResetMode);
            forgotPasswordForm.classList.toggle('hidden', isResetMode);
            resetPasswordForm.classList.toggle('hidden', !isResetMode);
            requestHelp.textContent = isResetMode
                ? 'If you opened this page from the reset email, enter a new password below.'
                : 'Enter your email address and we’ll send a password reset link.';
        }

        requestModeBtn.addEventListener('click', () => setMode('request'));
        resetModeBtn.addEventListener('click', () => setMode('reset'));

        if (new URLSearchParams(window.location.search).get('token')) {
            setMode('reset');
        }
    </script>
</body>
</html>
