<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Muse Cosmetics</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="animations.css">
    <style>
        .cart-section {
            padding: 120px 0 80px;
            min-height: 70vh;
        }
        .cart-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
        }
        .cart-items {
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: var(--shadow);
        }
        .cart-item {
            display: grid;
            grid-template-columns: 100px 1fr auto auto auto;
            gap: 20px;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .cart-item-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }
        .cart-item-details h4 {
            font-family: var(--font-secondary);
            margin-bottom: 5px;
            color: var(--dark-color);
        }
        .cart-item-size {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        .cart-item-price {
            font-weight: 600;
            color: var(--primary-color);
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 5px;
        }
        .qty-btn {
            width: 30px;
            height: 30px;
            border: none;
            background: var(--light-color);
            cursor: pointer;
            border-radius: 3px;
            transition: var(--transition);
        }
        .qty-btn:hover {
            background: var(--primary-color);
            color: var(--white);
        }
        .qty-value {
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }
        .cart-item-total {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--dark-color);
            min-width: 100px;
            text-align: right;
        }
        .remove-item {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 1.2rem;
            transition: var(--transition);
        }
        .remove-item:hover {
            transform: scale(1.2);
        }
        .cart-summary {
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: var(--shadow);
            height: fit-content;
            position: sticky;
            top: 100px;
        }
        .summary-title {
            font-family: var(--font-secondary);
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--dark-color);
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .summary-row.total {
            border-bottom: none;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid var(--primary-color);
        }
        .btn-checkout {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            font-size: 1.1rem;
        }
        .btn-continue {
            display: inline-block;
            margin-top: 15px;
            color: var(--primary-color);
            font-weight: 600;
        }
        .btn-continue:hover {
            text-decoration: underline;
        }
        .cart-empty {
            text-align: center;
            padding: 60px 20px;
        }
        .cart-empty i {
            font-size: 5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .cart-empty h2 {
            font-family: var(--font-secondary);
            margin-bottom: 15px;
        }
        .promo-code {
            margin: 20px 0;
        }
        .promo-code input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .promo-code button {
            width: 100%;
            padding: 10px;
            background: var(--dark-color);
            color: var(--white);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        @media screen and (max-width: 992px) {
            .cart-container {
                grid-template-columns: 1fr;
            }
            .cart-summary {
                position: static;
            }
            .cart-item {
                grid-template-columns: 80px 1fr;
                gap: 15px;
            }
            .cart-item-total, .quantity-control {
                grid-column: 2;
            }
            .remove-item {
                grid-column: 2;
                justify-self: start;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <span class="logo-icon"><i class="fas fa-spa"></i></span>
                    <span class="logo-text">Muse Cosmetics</span>
                </a>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="products.html" class="nav-link">Products</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="cart.html" class="nav-link active cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a></li>
                <li><a href="login.html" class="nav-link" id="authLink">Login</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- Cart Section -->
    <section class="cart-section">
        <div class="container">
            <h1 class="section-title text-center" style="margin-bottom: 50px;">Shopping Cart</h1>
            
            <div id="cartContent">
                <!-- Cart items will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col">
                    <h3>Muse Cosmetics</h3>
                    <p>Premium beauty products crafted with love in Nakuru, Kenya.</p>
                </div>
                <div class="footer-col">
                    <h3>Quick Links</h3>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="products.html">Products</a></li>
                        <li><a href="cart.html">Cart</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Muse Cosmetics. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
    <script src="cart.js"></script>
    <script src="products.js"></script>
    <script>
        // Render Cart
        function renderCart() {
            const container = document.getElementById('cartContent');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty">
                        <i class="fas fa-shopping-cart"></i>
                        <h2>Your Cart is Empty</h2>
                        <p>Looks like you haven't added any products yet.</p>
                        <a href="products.html" class="btn btn-primary" style="margin-top: 20px;">
                            <i class="fas fa-shopping-bag"></i> Continue Shopping
                        </a>
                    </div>
                `;
                return;
            }
            
            const subtotal = getCartTotal();
            const delivery = subtotal > 1000 ? 0 : 150; // Free delivery over 1000
            const total = subtotal + delivery;
            
            container.innerHTML = `
                <div class="cart-container">
                    <div class="cart-items">
                        <h3 style="margin-bottom: 20px; font-family: var(--font-secondary);">Cart Items (${cart.length})</h3>
                        ${cart.map((item, index) => `
                            <div class="cart-item">
                                <img src="${item.image}" alt="${item.name}" class="cart-item-image">
                                <div class="cart-item-details">
                                    <h4>${item.name}</h4>
                                    <div class="cart-item-size">Size: ${item.size}</div>
                                    <div class="cart-item-price">Ksh ${item.price}/=</div>
                                </div>
                                <div class="quantity-control">
                                    <button class="qty-btn" onclick="updateQuantity(${index}, -1)">-</button>
                                    <span class="qty-value">${item.quantity}</span>
                                    <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
                                </div>
                                <div class="cart-item-total">
                                    Ksh ${item.price * item.quantity}/=
                                </div>
                                <button class="remove-item" onclick="removeFromCart(${index})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="cart-summary">
                        <h3 class="summary-title">Order Summary</h3>
                        
                        <div class="promo-code">
                            <input type="text" placeholder="Enter promo code" id="promoCode">
                            <button onclick="applyPromoCode()">Apply Code</button>
                        </div>
                        
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>Ksh ${subtotal}/=</span>
                        </div>
                        <div class="summary-row">
                            <span>Delivery Fee</span>
                            <span>${delivery === 0 ? 'FREE' : 'Ksh ' + delivery + '/='}</span>
                        </div>
                        ${delivery > 0 ? '<p style="font-size: 0.85rem; color: var(--primary-color); margin: -10px 0 15px;">Free delivery on orders over Ksh 1,000</p>' : ''}
                        <div class="summary-row total">
                            <span>Total</span>
                            <span>Ksh ${total}/=</span>
                        </div>
                        
                        <button class="btn btn-primary btn-checkout" onclick="proceedToCheckout()">
                            <i class="fas fa-credit-card"></i> Proceed to Checkout
                        </button>
                        
                        <a href="products.html" class="btn-continue">
                            <i class="fas fa-arrow-left"></i> Continue Shopping
                        </a>
                    </div>
                </div>
            `;
        }
        
        function applyPromoCode() {
            const code = document.getElementById('promoCode').value;
            if (code.toUpperCase() === 'MUSE10') {
                showNotification('Promo code applied! 10% discount', 'success');
            } else {
                showNotification('Invalid promo code', 'error');
            }
        }
        
        function proceedToCheckout() {
            const token = localStorage.getItem('token');
            if (!token) {
                showNotification('Please login to checkout', 'error');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
                return;
            }
            window.location.href = 'checkout.html';
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
        });
    </script>
</body>
</html>
